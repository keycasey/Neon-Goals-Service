name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-service:
    runs-on: self-hosted
    steps:
      - name: Deploy Service
        run: |
          export PATH=/home/ec2-user/.bun/bin:$PATH
          cd /var/www/Neon-Goals-Service
          # Reset any local changes to ensure clean state from CI only
          git reset --hard HEAD
          git clean -fd
          git pull origin main
          bun install --frozen-lockfile
          bun run prisma:generate
          bun run prisma:migrate
          # Clean build artifacts to ensure fresh compilation (prevents stale incremental cache)
          rm -rf dist tsconfig.tsbuildinfo
          bun run build:deploy
          pm2 restart neon-goals-service
          pm2 list | grep neon-goals-service
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:3001/api/.well-known/oauth-protected-resource || {
            pm2 logs neon-goals-service --nostream --lines 120
            exit 1
          }

      - name: Deploy Worker
        run: |
          cd /var/www/Neon-Goals-Service
          bash scripts/deploy-worker.sh
